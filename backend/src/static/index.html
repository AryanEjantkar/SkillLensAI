<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ed">
  <title>Gemma 4 Prompt Test</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f3ed;
      --ink: #17251d;
      --muted: #647168;
      --line: #d5dbd3;
      --green: #176b4b;
      --green-dark: #10543a;
      --red: #9b342b;
      --white: #fffefa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100% - 40px, 760px);
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    .eyebrow, label, button, .meta, .notice {
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 56px);
      font-weight: 500;
      line-height: 1.04;
    }

    .model {
      margin: 14px 0 34px;
      color: var(--muted);
      font: 13px/1.5 "Segoe UI", Tahoma, sans-serif;
      overflow-wrap: anywhere;
    }

    form { display: grid; gap: 10px; }

    label {
      font-size: 13px;
      font-weight: 650;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--white);
      color: var(--ink);
      padding: 14px;
      font: 16px/1.5 "Segoe UI", Tahoma, sans-serif;
    }

    textarea:focus-visible, button:focus-visible {
      outline: 3px solid #86bba0;
      outline-offset: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 5px;
      background: var(--green);
      color: white;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: var(--green-dark); }
    button:disabled { cursor: wait; opacity: .72; }

    .notice {
      margin: 18px 0 0;
      color: var(--red);
      font-size: 14px;
      line-height: 1.5;
    }

    .notice:empty { display: none; }

    .result {
      margin-top: 36px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
    }

    .result h2 {
      margin: 0 0 12px;
      font: 650 13px "Segoe UI", Tahoma, sans-serif;
    }

    .answer {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 17px/1.65 Georgia, "Times New Roman", serif;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      border: 2px solid #ffffff80;
      border-top-color: white;
      border-radius: 50%;
      vertical-align: -2px;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      main { width: min(100% - 28px, 760px); padding-top: 34px; }
      .controls { align-items: flex-start; flex-direction: column; }
      button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Model connection check</p>
    <h1>Talk to Gemma 4</h1>
    <p class="model">gemma-4-26b-a4b-it</p>

    <form id="prompt-form">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" name="prompt" maxlength="10000" required
        placeholder="Write a short prompt to test the model."></textarea>
      <div class="controls">
        <span id="counter" class="meta">0 / 10,000</span>
        <button id="submit" type="submit">Send to Gemma 4</button>
      </div>
    </form>

    <p id="error" class="notice" role="alert"></p>
    <section id="result" class="result" aria-live="polite" hidden>
      <h2>Response</h2>
      <p id="answer" class="answer"></p>
    </section>
  </main>

  <script>
    const form = document.querySelector("#prompt-form");
    const promptField = document.querySelector("#prompt");
    const submitButton = document.querySelector("#submit");
    const counter = document.querySelector("#counter");
    const error = document.querySelector("#error");
    const result = document.querySelector("#result");
    const answer = document.querySelector("#answer");

    promptField.addEventListener("input", () => {
      counter.textContent = `${promptField.value.length.toLocaleString()} / 10,000`;
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const prompt = promptField.value.trim();
      error.textContent = "";
      result.hidden = true;

      if (!prompt) {
        error.textContent = "Enter a prompt before sending.";
        promptField.focus();
        return;
      }

      submitButton.disabled = true;
      submitButton.innerHTML = '<span class="spinner" aria-hidden="true"></span>Generating...';

      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "The request failed.");
        answer.textContent = data.response;
        result.hidden = false;
      } catch (requestError) {
        error.textContent = requestError.message || "Unable to reach the backend.";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Send to Gemma 4";
      }
    });
  </script>
</body>
</html>
