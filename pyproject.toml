[project]
name = "skilllens-ai"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "google-genai>=2.0,<3",
    "httpx>=0.27,<1",
    "pypdf>=5,<7",
    "python-dotenv>=1.0,<2",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[tool.vercel]
entrypoint = "backend.src.main:app"
