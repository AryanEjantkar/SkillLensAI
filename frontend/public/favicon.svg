<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14102c"/>
      <stop offset="50%" stop-color="#1d1645"/>
      <stop offset="100%" stop-color="#0c091d"/>
    </linearGradient>

    <!-- Outer Lens Ring Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="45%" stop-color="#6051df"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Mid Lens / Iris Gradient -->
    <linearGradient id="irisGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Emerald Focus Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#e0e7ff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6051df" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#bgGrad)" stroke="#39306b" stroke-width="8"/>

  <!-- Subtle Outer Halo -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="#6051df" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 12"/>

  <!-- Outer Optical Lens Ring -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="url(#lensGrad)" stroke-width="26" filter="url(#outerGlow)"/>

  <!-- Concentric Inner Iris Ring -->
  <circle cx="256" cy="256" r="108" fill="none" stroke="url(#irisGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Optical Iris Aperture Notch / Flare -->
  <circle cx="340" cy="180" r="14" fill="url(#accentGrad)"/>

  <!-- Core AI Radial Flare -->
  <circle cx="256" cy="256" r="78" fill="url(#coreGlow)"/>

  <!-- Central AI Brilliance Star (SkillLens Focus) -->
  <path d="M 256,168 Q 256,256 344,256 Q 256,256 256,344 Q 256,256 168,256 Q 256,256 256,168 Z"
        fill="#ffffff"
        filter="url(#softGlow)"/>

  <!-- Inner Sparkle Core -->
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>

  <!-- Secondary Satellite AI Sparkle -->
  <path d="M 364,128 Q 364,146 382,146 Q 364,146 364,164 Q 364,146 346,146 Q 364,146 364,128 Z"
        fill="#38bdf8"
        opacity="0.9"/>
</svg>
